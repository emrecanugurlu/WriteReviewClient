<mat-sidenav-container class="admin-container">

  <mat-sidenav #sidenav mode="side" opened class="admin-sidenav w-[220px]">

    <!-- Logo -->
    <div class="px-6 py-5 border-b border-slate-100 dark:border-slate-700">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-slate-900 flex items-center justify-center shrink-0">
          <span class="material-symbols-rounded text-white text-[16px]">edit_document</span>
        </div>
        <span class="text-[15px] font-bold text-slate-800 dark:text-slate-100" style="font-family:'Outfit',sans-serif;">WriteReview</span>
      </div>
    </div>

    <!-- Nav -->
    <nav class="px-3 py-4 flex flex-col gap-0.5">
      <a routerLink="dashboard" routerLinkActive="active-link"
         class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-[13px] font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">
        <span class="material-symbols-rounded text-[18px]">dashboard</span>
        <span>Dashboard</span>
      </a>
      <a routerLink="users" routerLinkActive="active-link"
         class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-[13px] font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">
        <span class="material-symbols-rounded text-[18px]">group</span>
        <span>Kullanıcılar</span>
      </a>
      <a routerLink="articles" routerLinkActive="active-link"
         class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-[13px] font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">
        <span class="material-symbols-rounded text-[18px]">article</span>
        <span>Makaleler</span>
      </a>
      <a routerLink="expertise-areas" routerLinkActive="active-link"
         class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-[13px] font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">
        <span class="material-symbols-rounded text-[18px]">category</span>
        <span>Uzmanlık Alanları</span>
      </a>
      <a routerLink="roles" routerLinkActive="active-link"
         class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-[13px] font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">
        <span class="material-symbols-rounded text-[18px]">shield</span>
        <span>Roller</span>
      </a>
    </nav>

    <!-- Bottom -->
    <div class="mt-auto px-3 py-4 border-t border-slate-100 dark:border-slate-700">
      <button (click)="logout()"
         class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-[13px] font-medium text-slate-500 dark:text-slate-400 hover:text-red-600 hover:bg-red-50 transition-all">
        <span class="material-symbols-rounded text-[18px]">logout</span>
        <span>Çıkış Yap</span>
      </button>
    </div>

  </mat-sidenav>

  <mat-sidenav-content class="admin-content flex flex-col bg-slate-50 dark:bg-slate-900">

    <!-- Topbar -->
    <header class="flex items-center justify-end px-6 py-3 bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700 shrink-0">
      <button class="admin-theme-toggle" (click)="themeService.toggle()"
              [title]="themeService.isDark() ? 'Açık Temaya Geç' : 'Koyu Temaya Geç'">
        <span class="material-symbols-rounded">{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</span>
      </button>
      <a routerLink="profile"
        class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
        <div class="w-7 h-7 rounded-full bg-slate-900 flex items-center justify-center text-white text-xs font-bold shrink-0">
          {{ adminName().charAt(0).toUpperCase() }}
        </div>
        <span class="text-[13px] font-semibold text-slate-700 dark:text-slate-200">{{ adminName() }}</span>
      </a>
    </header>

    <main class="content-wrapper flex-1 overflow-auto">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
