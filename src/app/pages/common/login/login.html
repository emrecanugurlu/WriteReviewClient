<div class="min-h-screen flex font-sans text-slate-900 bg-slate-50">
  <!-- Sol Taraf - Görsel ve Marka Alanı (Masaüstünde görünür) -->
  <div class="hidden lg:flex w-1/2 relative bg-slate-900 overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-slate-900/90 to-indigo-900/80 z-10"></div>

    <!-- Akademik/Kütüphane Görseli -->
    <img
      ngSrc="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?auto=format&fit=crop&q=80&w=1600"
      alt="Kütüphane ve kitaplar"
      class="absolute inset-0 w-full h-full object-cover mix-blend-overlay opacity-60"
      fill/>

    <div class="relative z-20 flex flex-col justify-between h-full p-12 text-white">
      <!-- Logo Alanı -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-white/10 backdrop-blur-sm border border-white/20 rounded-lg flex items-center justify-center text-white">
          <!-- BookOpen Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <span class="text-2xl font-semibold tracking-wide font-serif">Makale <span class="text-indigo-300">Tetkik</span></span>
      </div>

      <!-- Ana Metin -->
      <div class="space-y-8 mb-12">
        <h1 class="text-4xl font-serif font-medium leading-tight">
          Bilimin ışığında,<br />
          <span class="text-indigo-200">objektif değerlendirme.</span>
        </h1>
        <p class="text-lg text-slate-300 max-w-md leading-relaxed font-light">
          Akademik yayın süreçlerini hızlandırın. Editörler, hakemler ve yazarlar için geliştirilmiş güvenli makale yönetim platformu.
        </p>
      </div>

      <!-- Footer kaldırıldı -->
    </div>
  </div>

  <!-- Sağ Taraf - Giriş Formu -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-6 lg:p-12 relative bg-white">
    <div class="w-full max-w-md space-y-8">

      <!-- Mobil Logo (Sadece mobilde) -->
      <div class="lg:hidden flex justify-center mb-8">
        <div class="w-12 h-12 bg-slate-900 rounded-xl flex items-center justify-center text-white">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
      </div>

      <div class="text-center lg:text-left space-y-2">
        <h2 class="text-3xl font-serif font-bold text-slate-900">Sisteme Giriş</h2>
        <p class="text-slate-500">Hakem, yazar veya editör hesabınızla devam edin.</p>
      </div>

      <!-- Angular Form -->
      <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()">
        <div class="space-y-5">

          <!-- Email Input -->
          <div class="group">
            <label htmlFor="email" class="block text-sm font-medium text-slate-700 mb-1">
              Kurumsal E-posta
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <!-- Mail Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400 group-focus-within:text-indigo-600 transition-colors"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </div>
              <input
                id="email"
                name="email"
                type="email"
                [(ngModel)]="email"
                required
                class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 sm:text-sm transition-all duration-200 bg-slate-50 focus:bg-white"
                placeholder="ad.soyad@universite.edu.tr"
              />
            </div>
          </div>

          <!-- Password Input -->
          <div class="group">
            <div class="flex items-center justify-between mb-1">
              <label htmlFor="password" class="block text-sm font-medium text-slate-700">
                Şifre
              </label>
              <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 hover:underline">
                Şifrenizi mi unuttunuz?
              </a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <!-- Lock Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400 group-focus-within:text-indigo-600 transition-colors"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
              <input
                id="password"
                name="password"
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="password"
                required
                class="block w-full pl-10 pr-10 py-3 border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 sm:text-sm transition-all duration-200 bg-slate-50 focus:bg-white"
                placeholder="••••••••"
              />
              <button
                type="button"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
                (click)="togglePassword()"
              >
                @if (showPassword) {
                  <!-- EyeOff Icon -->
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                } @else {
                  <!-- Eye Icon -->
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                }
              </button>
            </div>
          </div>
        </div>

        <div class="flex items-center">
          <input
            id="remember-me"
            name="remember-me"
            type="checkbox"
            class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded cursor-pointer"
          />
          <label htmlFor="remember-me" class="ml-2 block text-sm text-slate-600 cursor-pointer select-none">
            Bu cihazda beni hatırla
          </label>
        </div>

        <button
          type="submit"
          [disabled]="isLoading"
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all duration-200 shadow-lg shadow-slate-900/20 disabled:opacity-70 disabled:cursor-not-allowed"
        >
          @if (isLoading) {
            <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          } @else {
            <span class="flex items-center">
                  Panele Giriş Yap
              <!-- ArrowRight Icon -->
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-2 group-hover:translate-x-1 transition-transform"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </span>
          }
        </button>
      </form>
    </div>
  </div>
</div>
