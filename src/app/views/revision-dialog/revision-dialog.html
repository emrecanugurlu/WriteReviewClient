<!-- Başarı Durumu -->
@if (success) {
  <div class="flex flex-col items-center text-center p-10 gap-6">
    <div class="w-24 h-24 rounded-full bg-cyan-50 flex items-center justify-center">
      <span class="material-symbols-rounded text-cyan-500 text-[52px]">mark_email_read</span>
    </div>
    <div>
      <h2 class="text-2xl font-black text-slate-800 mb-2" style="font-family:'Outfit',sans-serif;">Revizyon İstendi!</h2>
      <p class="text-slate-500 text-sm">Yazara revizyon notu iletildi. Yazar düzenlemelerini tamamlayıp geri gönderecektir.</p>
    </div>
    <button (click)="close()"
      class="px-8 py-3 rounded-full bg-cyan-600 text-white font-bold text-sm hover:bg-cyan-700 transition-all shadow-lg shadow-cyan-600/25">
      Kapat
    </button>
  </div>
} @else {
  <div class="flex flex-col font-sans text-slate-800 select-none">

    <!-- Header -->
    <div class="flex items-center justify-between px-7 pt-7 pb-5">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/25">
          <span class="material-symbols-rounded text-white text-[26px]">history_edu</span>
        </div>
        <div>
          <h2 class="font-black text-slate-800 text-xl leading-tight" style="font-family:'Outfit',sans-serif;">Revizyon İste</h2>
          <p class="text-xs text-slate-400 mt-0.5">Yazara iletilecek düzeltme talebi</p>
        </div>
      </div>
      <button (click)="close()"
        class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-700 transition-all">
        <span class="material-symbols-rounded text-[20px]">close</span>
      </button>
    </div>

    <!-- Not Alanı -->
    <div class="px-6 mb-2">
      <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">
        Revizyon Notu <span class="text-red-400 normal-case font-normal tracking-normal">(en az 10 karakter)</span>
      </label>
      <textarea rows="5" [(ngModel)]="note"
        class="w-full text-sm px-5 py-4 rounded-2xl border border-slate-200 bg-slate-50/50 text-slate-800 placeholder-slate-400 focus:border-cyan-400 focus:ring-4 focus:ring-cyan-50 focus:bg-white outline-none resize-none leading-relaxed transition-all"
        placeholder="Örn: Literatür taramasını genişletin, yöntem bölümünü netleştirin ve istatistiksel analizleri yeniden gözden geçirin..."></textarea>
      <div class="flex items-center justify-between mt-2">
        <p class="text-[11px] text-slate-400">Bu not doğrudan yazara iletilecektir.</p>
        <span class="text-[11px] font-bold" [class]="note.length >= 10 ? 'text-cyan-600' : 'text-slate-400'">
          {{ note.length }} karakter
        </span>
      </div>
    </div>

    <!-- Ayraç -->
    <div class="h-px bg-slate-100 mx-6 my-4"></div>

    <!-- Footer -->
    <div class="px-6 pb-7 flex items-center gap-3">
      <button (click)="close()"
        class="flex-1 px-5 py-3 rounded-full text-sm font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 transition-all">
        Vazgeç
      </button>
      <button (click)="confirm()" [disabled]="!isValid || loading"
        class="flex-1 flex items-center justify-center gap-2 px-5 py-3 rounded-full text-white text-sm font-bold transition-all shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
        [class]="isValid ? 'bg-cyan-600 hover:bg-cyan-700 shadow-cyan-600/25' : 'bg-slate-300 shadow-none'">
        @if (loading) {
          <span class="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin"></span>
          İşleniyor...
        } @else {
          <span class="material-symbols-rounded text-[18px]">send</span>
          Revizyon Gönder
        }
      </button>
    </div>

  </div>
}
