<div class="flex flex-col select-none" style="width: 420px;">

  @if (success) {

    <!-- Başarı -->
    <div class="flex flex-col items-center text-center px-8 py-10 gap-4">
      <div class="w-11 h-11 rounded-xl bg-slate-900 flex items-center justify-center">
        <span class="material-symbols-rounded text-white text-[20px]">check</span>
      </div>
      <div>
        <p class="text-[14px] font-bold text-slate-900 mb-1">Revizyon İstendi</p>
        <p class="text-[13px] text-slate-400 leading-relaxed">Revizyon notu yazara iletildi.</p>
      </div>
      <button (click)="close()"
        class="mt-2 px-6 py-2.5 rounded-lg bg-slate-900 hover:bg-slate-700 text-white text-[13px] font-medium transition-all">
        Kapat
      </button>
    </div>

  } @else {

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center shrink-0">
          <span class="material-symbols-rounded text-white text-[17px]">history_edu</span>
        </div>
        <div>
          <p class="text-[13px] font-semibold text-slate-800">Revizyon İste</p>
          <p class="text-[11px] text-slate-400">Yazara iletilecek düzeltme talebi</p>
        </div>
      </div>
      <button (click)="close()"
        class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-all">
        <span class="material-symbols-rounded text-[20px]">close</span>
      </button>
    </div>

    <!-- Not Alanı -->
    <div class="px-6 pt-5 pb-4">
      <div class="flex items-center justify-between mb-1.5">
        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
          Revizyon Notu <span class="text-red-400">*</span>
        </label>
        <span class="text-[11px] font-medium"
          [class.text-slate-500]="isValid"
          [class.text-slate-300]="!isValid">
          {{ note.length }} / 10+
        </span>
      </div>
      <textarea rows="5" [(ngModel)]="note"
        class="w-full px-3 py-2.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-800 placeholder-slate-400 text-[13px] focus:border-slate-400 focus:bg-white outline-none resize-none leading-relaxed transition-all"
        placeholder="Hangi bölümlerin düzeltilmesi gerektiğini açıklayın. Bu not doğrudan yazara iletilecektir."></textarea>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-slate-100">
      <button (click)="close()"
        class="px-4 py-2.5 rounded-lg text-slate-600 text-[13px] font-medium hover:bg-slate-100 transition-all">
        Vazgeç
      </button>
      <button (click)="confirm()" [disabled]="!isValid || loading"
        class="flex items-center gap-1.5 px-5 py-2.5 rounded-lg bg-slate-900 hover:bg-slate-700 text-white text-[13px] font-medium transition-all disabled:opacity-40 disabled:cursor-not-allowed">
        @if (loading) {
          <span class="w-3.5 h-3.5 rounded-full border-2 border-white/30 border-t-white animate-spin"></span>
          İşleniyor...
        } @else {
          <span class="material-symbols-rounded text-[15px]">send</span>
          Gönder
        }
      </button>
    </div>

  }
</div>
