<!-- Başarı Durumu -->
@if (success) {
  <div class="flex flex-col items-center text-center p-10 gap-6">
    <div class="w-24 h-24 rounded-full bg-emerald-50 flex items-center justify-center">
      <span class="material-symbols-rounded text-emerald-500 text-[52px]">check_circle</span>
    </div>
    <div>
      <h2 class="text-2xl font-black text-slate-800 mb-2" style="font-family:'Outfit',sans-serif;">Makale Onaylandı!</h2>
      <p class="text-slate-500 text-sm">Makale başarıyla onaylanmış ve yazar bilgilendirilecektir.</p>
    </div>
    <button (click)="close()"
      class="px-8 py-3 rounded-full bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700 transition-all shadow-lg shadow-emerald-600/25">
      Kapat
    </button>
  </div>
} @else {
  <!-- Onay İçeriği -->
  <div class="flex flex-col font-sans text-slate-800 select-none">

    <!-- Header -->
    <div class="flex items-center justify-between px-7 pt-7 pb-5">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/25">
          <span class="material-symbols-rounded text-white text-[26px]">task_alt</span>
        </div>
        <div>
          <h2 class="font-black text-slate-800 text-xl leading-tight" style="font-family:'Outfit',sans-serif;">Makaleyi Onayla</h2>
          <p class="text-xs text-slate-400 mt-0.5">Editör kararı — geri alınamaz</p>
        </div>
      </div>
      <button (click)="close()"
        class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-700 transition-all">
        <span class="material-symbols-rounded text-[20px]">close</span>
      </button>
    </div>

    <!-- Uyarı Bandı -->
    <div class="mx-6 mb-5 p-4 rounded-2xl bg-emerald-50 border border-emerald-100 flex items-start gap-3">
      <span class="material-symbols-rounded text-emerald-600 text-[20px] shrink-0 mt-0.5">info</span>
      <p class="text-sm text-emerald-800 leading-relaxed">
        Bu makale <strong>"Onaylandı"</strong> statüsüne geçecek ve yazara otomatik bildirim gönderilecektir. Bu işlem geri alınamaz.
      </p>
    </div>

    <!-- Ayraç -->
    <div class="h-px bg-slate-100 mx-6 mb-6"></div>

    <!-- Footer Aksiyonlar -->
    <div class="px-6 pb-7 flex items-center gap-3">
      <button (click)="close()"
        class="flex-1 px-5 py-3 rounded-full text-sm font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 transition-all">
        Vazgeç
      </button>
      <button (click)="confirm()" [disabled]="loading"
        class="flex-1 flex items-center justify-center gap-2 px-5 py-3 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold transition-all shadow-lg shadow-emerald-600/25 disabled:opacity-60 disabled:cursor-not-allowed">
        @if (loading) {
          <span class="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin"></span>
          İşleniyor...
        } @else {
          <span class="material-symbols-rounded text-[18px]">check_circle</span>
          Onayla
        }
      </button>
    </div>

  </div>
}
