<div class="flex flex-col select-none" style="width: 420px;">

  @if (success) {

    <!-- Başarı -->
    <div class="flex flex-col items-center text-center px-8 py-10 gap-4">
      <div class="w-11 h-11 rounded-xl bg-slate-900 flex items-center justify-center">
        <span class="material-symbols-rounded text-white text-[20px]">check</span>
      </div>
      <div>
        <p class="text-[14px] font-bold text-slate-900 mb-1">Makale Onaylandı</p>
        <p class="text-[13px] text-slate-400 leading-relaxed">Yazar otomatik olarak bilgilendirilecektir.</p>
      </div>
      <button (click)="close()"
        class="mt-2 px-6 py-2.5 rounded-lg bg-slate-900 hover:bg-slate-700 text-white text-[13px] font-medium transition-all">
        Kapat
      </button>
    </div>

  } @else {

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center shrink-0">
          <span class="material-symbols-rounded text-white text-[17px]">task_alt</span>
        </div>
        <div>
          <p class="text-[13px] font-semibold text-slate-800">Makaleyi Onayla</p>
          <p class="text-[11px] text-slate-400">Editör kararı — geri alınamaz</p>
        </div>
      </div>
      <button (click)="close()"
        class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-all">
        <span class="material-symbols-rounded text-[20px]">close</span>
      </button>
    </div>

    <!-- Bilgi -->
    <div class="px-6 py-6">
      <p class="text-[13px] text-slate-500 leading-relaxed">
        Bu makale <span class="font-semibold text-slate-700">Onaylandı</span> statüsüne geçecek ve yazara otomatik bildirim gönderilecektir. İşlem tamamlandıktan sonra geri alınamaz.
      </p>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-slate-100">
      <button (click)="close()"
        class="px-4 py-2.5 rounded-lg text-slate-600 text-[13px] font-medium hover:bg-slate-100 transition-all">
        Vazgeç
      </button>
      <button (click)="confirm()" [disabled]="loading"
        class="flex items-center gap-1.5 px-5 py-2.5 rounded-lg bg-slate-900 hover:bg-slate-700 text-white text-[13px] font-medium transition-all disabled:opacity-40 disabled:cursor-not-allowed">
        @if (loading) {
          <span class="w-3.5 h-3.5 rounded-full border-2 border-white/30 border-t-white animate-spin"></span>
          İşleniyor...
        } @else {
          <span class="material-symbols-rounded text-[15px]">check</span>
          Onayla
        }
      </button>
    </div>

  }
</div>
