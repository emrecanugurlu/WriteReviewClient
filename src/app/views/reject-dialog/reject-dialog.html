<!-- 
<div class="fixed inset-0 z-50 flex items-center justify-center p-4"></div>
  Backdrop -->
<div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" (click)="closeRejectDialog()"></div>

<!-- Modal Content -->
<div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all scale-100">
  <div class="p-6 text-center">
    <!-- Icon -->
    <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4">
      <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-600">
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
      </div>
    </div>

    <h3 class="text-lg font-bold text-gray-900 mb-2">Makaleyi Reddet</h3>
    <p class="text-sm text-gray-500 mb-6">
      Çalışmayı geri alınamaz şekilde <span class="font-semibold text-gray-700">"Reddedildi"</span> statüsüne
      geçirecek ve yazara bildirim gidecektir.
    </p>

    <div class="text-left mb-6">
      <label class="block text-sm font-semibold text-gray-700 mb-1.5 ml-1">Red Nedeni / Editör Notu</label>
      <textarea rows="4" [(ngModel)]="reason"
        class="w-full text-sm p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-red-100 focus:border-red-300 outline-none resize-none transition-all placeholder:text-gray-400"
        placeholder="Örn: Çalışma dergi kapsamı dışındadır veya yöntem eksiklikleri mevcuttur..."></textarea>
    </div>

    <div class="flex gap-3">
      <button (click)="closeRejectDialog()"
        class="flex-1 px-4 py-2.5 bg-white border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors">
        İptal Et
      </button>
      <button (click)="confirmReject()"
        class="flex-1 px-4 py-2.5 bg-red-600 text-white text-sm font-medium rounded-lg hover:bg-red-700 shadow-md shadow-red-200 transition-colors">
        Makaleyi Reddet
      </button>
    </div>
  </div>
</div>
