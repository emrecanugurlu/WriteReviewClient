<div class="flex flex-col select-none w-full max-w-[420px]">

  <!-- Header -->
  <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center shrink-0">
        <span class="material-symbols-rounded text-white text-[17px]">psychology_alt</span>
      </div>
      <div>
        <p class="text-[13px] font-semibold text-slate-800">{{ isEditMode ? 'Alanı Düzenle' : 'Yeni Uzmanlık Alanı' }}</p>
        <p class="text-[11px] text-slate-400">{{ isEditMode ? 'Alan adını güncelleyin' : 'Sisteme yeni alan ekleyin' }}</p>
      </div>
    </div>
    <button (click)="close()"
      class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-all">
      <span class="material-symbols-rounded text-[20px]">close</span>
    </button>
  </div>

  <!-- Content -->
  <div class="px-6 py-6">
    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
      Alan Adı <span class="text-red-400">*</span>
    </label>
    <input type="text"
      [ngModel]="name()"
      (ngModelChange)="name.set($event); error.set(null)"
      placeholder="Örn: Yapay Zeka, Veri Bilimi..."
      [disabled]="loading()"
      class="w-full px-3 py-2.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-800 placeholder-slate-400 text-[13px] focus:border-slate-400 focus:bg-white outline-none transition-all" />

    @if (error()) {
      <div class="mt-2 flex items-center gap-1.5">
        <span class="material-symbols-rounded text-red-400 text-[14px]">error</span>
        <p class="text-[12px] text-red-600">{{ error() }}</p>
      </div>
    }
  </div>

  <!-- Footer -->
  <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-slate-100">
    <button (click)="close()"
      class="px-4 py-2.5 rounded-lg text-slate-600 text-[13px] font-medium hover:bg-slate-100 transition-all">
      Vazgeç
    </button>
    <button (click)="save()" [disabled]="loading() || !name().trim()"
      class="flex items-center gap-1.5 px-5 py-2.5 rounded-lg bg-slate-900 hover:bg-slate-700 text-white text-[13px] font-medium transition-all disabled:opacity-40 disabled:cursor-not-allowed">
      @if (loading()) {
        <span class="w-3.5 h-3.5 rounded-full border-2 border-white/30 border-t-white animate-spin"></span>
        Kaydediliyor...
      } @else {
        <span class="material-symbols-rounded text-[15px]">check</span>
        {{ isEditMode ? 'Güncelle' : 'Kaydet' }}
      }
    </button>
  </div>

</div>
