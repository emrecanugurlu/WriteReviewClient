
<div class="page">
  <header class="topbar" style="justify-content: right">
    <div class="actions">
      <button type="button"  (click)="saveArticle(false)" matButton="outlined" style="border-radius: 10px">Taslağı Kaydet</button>
      <button type="button" (click)="saveArticle(true)" [disabled]="form.invalid" matButton = "filled" style="border-radius: 8px">Yayıma Gönder</button>
    </div>
  </header>

  @if (ok()){

  }
  @if (error){
    <p style="color:#0a0;">Taslak kaydedildi.</p>
    <p style="color:#c00;">{{ error }}</p>
  }

  <form [formGroup]="form" class="grid">
    <section class="card main">
      <label>Başlık
        <input formControlName="title" placeholder="Örn: Mikroservislerde Gözlemlenebilirlik" />
      </label>

      <label>Özet
        <textarea formControlName="summary" rows="3" placeholder="Kısa bir özet..."></textarea>
      </label>

      <label>İçerik
        <textarea formControlName="content" rows="12" placeholder="Makale içeriği..."></textarea>
      </label>

      <div class="meta-row">
        <span>Kelime: {{ wordCount }}</span>
        @if (form.invalid){
          <span class="muted" >Kaydetmek için zorunlu alanları doldur.</span>
        }
      </div>
    </section>

    <aside class="card side">
      <label>Kategori
        <select formControlName="categoryId">
          <option [ngValue]="null">Seçin…</option>
          @for (c of categories; track c.id) {
            <option [ngValue]="c.id">{{ c.name }}</option>
          }
        </select>
      </label>

      <label>Etiketler (virgülle ayırın)
        <input formControlName="tags" placeholder="angular, jwt, ef-core" />
      </label>

      <label>Kapak Görseli (opsiyonel)
        <input type="file" (change)="onFile($event)" />
      </label>
    </aside>
  </form>
</div>
